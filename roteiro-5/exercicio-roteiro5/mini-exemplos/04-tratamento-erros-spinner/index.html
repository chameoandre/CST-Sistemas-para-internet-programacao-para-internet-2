<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-Exemplo 4: Tratamento de Falhas & Spinners</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
  <div class="container" style="max-width: 520px;">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title mb-3">Mini-Exemplo 4: Resiliência & Spinner</h5>
        <p class="text-muted small">
          Controle de estados de carregamento (<em>Loading State</em>) e tratamento resiliente de falhas de rede com <code>try...catch...finally</code>.
        </p>

        <button id="btnVerificar" class="btn btn-primary w-100 d-flex justify-content-center align-items-center gap-2 mb-3">
          <span id="iconeBotao"><i class="bi bi-arrow-repeat"></i></span>
          <span id="spinnerCarregamento" class="spinner-border spinner-border-sm d-none" role="status"></span>
          <span id="textoBotao">Testar Conexão com o Servidor</span>
        </button>

        <div id="caixaAlerta" class="alert d-none mb-0" role="alert">
          <!-- Mensagem amigável de sucesso ou erro -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // 1. Mapeamento dos elementos da interface
    const btnVerificar = document.getElementById('btnVerificar');
    const iconeBotao = document.getElementById('iconeBotao');
    const spinnerCarregamento = document.getElementById('spinnerCarregamento');
    const textoBotao = document.getElementById('textoBotao');
    const caixaAlerta = document.getElementById('caixaAlerta');

    // 2. Funções auxiliares para clareza visual de estados
    function ativarEstadoCarregando() {
      btnVerificar.disabled = true;
      iconeBotao.classList.add('d-none');
      spinnerCarregamento.classList.remove('d-none');
      textoBotao.textContent = 'Consultando Servidor...';
      caixaAlerta.classList.add('d-none');
    }

    function desativarEstadoCarregando() {
      spinnerCarregamento.classList.add('d-none');
      iconeBotao.classList.remove('d-none');
      textoBotao.textContent = 'Testar Conexão com o Servidor';
      btnVerificar.disabled = false;
      caixaAlerta.classList.remove('d-none');
    }

    // 3. Função assíncrona nomeada com bloco defensivo try...catch...finally
    async function testarConexaoComServidor() {
      ativarEstadoCarregando();

      try {
        const resposta = await fetch('http://127.0.0.1:5000/api/status');

        // Validação explícita da resposta HTTP
        if (resposta.ok === false) {
          throw new Error(`O servidor retornou o código de erro HTTP ${resposta.status}.`);
        }

        const dados = await resposta.json();

        // Cenário de sucesso
        caixaAlerta.className = 'alert alert-success mb-0';
        caixaAlerta.innerHTML = `
          <i class="bi bi-check-circle-fill me-1"></i>
          <strong>API Online!</strong> Conectado ao servidor (${dados.servidor}).
        `;

      } catch (erro) {
        // Cenário de falha (queda de rede ou servidor desligado)
        caixaAlerta.className = 'alert alert-danger mb-0';
        caixaAlerta.innerHTML = `
          <i class="bi bi-exclamation-triangle-fill me-1"></i>
          <strong>Falha de Conectividade:</strong> Não foi possível falar com a API.<br>
          <small class="text-muted">Detalhe: ${erro.message}</small>
        `;

      } finally {
        // O bloco FINALLY é SEMPRE executado, garantindo que o spinner nunca trave na tela
        desativarEstadoCarregando();
      }
    }

    // 4. Vinculação do evento
    btnVerificar.addEventListener('click', testarConexaoComServidor);
  </script>
</body>
</html>
