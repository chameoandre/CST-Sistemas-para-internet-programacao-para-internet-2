<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 1. No <head>: Bootstrap 5 CSS do site getbootstrap.com -->

    <title>Exemplo 2</title>
</head>

<body>
