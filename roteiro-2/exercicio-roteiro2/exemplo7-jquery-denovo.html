<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 6 - jQuery</title>

    <!-- 1. No <head>: Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- 2. No <head>: Bootstrap Icons (Obrigatório para os ícones <i class="bi bi-*">) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- 3. No <head>: chamada do jQuery -->
</head>

<body>
    <!-- 1. Estrutura HTML Base Unificada (Bootstrap 5) -->
    <form id="form-cadastro">
        <input type="text" id="input-nome" class="form-control mb-2" placeholder="Nome">
        <input type="email" id="input-email" class="form-control mb-2" placeholder="E-mail">
        <button type="submit" id="btn-salvar" class="btn btn-primary">Salvar</button>
    </form>

    <div id="caixa-mensagem" class="alert alert-info mt-3 d-none"></div>

    <!-- 2. Inclusão do jQuery e Script app.js -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#form-cadastro').on('submit', function (e) {
                e.preventDefault();
                const nome = $('#input-nome').val();
                const email = $('#input-email').val();


                $('#caixa-mensagem')
                    .removeClass('d-none alert-info alert-danger')
                    .addClass('alert-success')
                    .html(`Lido: <strong>${nome}</strong> (${email})`)
                    .fadeOut(300).fadeIn(300)
                    .fadeOut(150).fadeIn(400);
            });
        });
    </script>
</body>

</html>
