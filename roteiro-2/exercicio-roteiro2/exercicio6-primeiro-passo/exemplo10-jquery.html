<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exemplo 10 - jQuery (DOM Dinâmico e Tabela)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <h2>Exemplo 10 — Manipulação Dinâmica da Tabela (.append() e .remove())</h2>
    
    <form id="form-cadastro" class="card p-3 mb-3">
        <input type="text" id="input-nome" class="form-control mb-2" placeholder="Nome do Cliente">
        <input type="email" id="input-email" class="form-control mb-2" placeholder="E-mail">
        <button type="submit" id="btn-salvar" class="btn btn-primary">Salvar Cliente</button>
    </form>

    <!-- 📍 DICA DE POSICIONAMENTO: Tabela inserida APÓS o <form id="form-cadastro"> -->
    <table class="table table-striped mt-3">
        <thead class="table-dark">
            <tr><th>Nome</th><th>E-mail</th><th>Ação</th></tr>
        </thead>
        <tbody id="tabela-corpo">
            <!-- As novas linhas <tr> serão inseridas aqui dinamicamente pelo jQuery -->
        </tbody>
    </table>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
      $(document).ready(function() {
        $('#form-cadastro').on('submit', function(e) {
          e.preventDefault();
          const nome = $('#input-nome').val();
          const email = $('#input-email').val();

          // Exemplo 10: Inserindo nova linha na tabela com .append()
          const trHtml = `
            <tr>
              <td>${nome}</td>
              <td>${email}</td>
              <td><button class="btn btn-danger btn-sm btn-excluir">Remover</button></td>
            </tr>
          `;
          $('#tabela-corpo').append(trHtml);
          $('#form-cadastro')[0].reset();
        });

        // Removendo linha com fadeOut + remove()
        $('#tabela-corpo').on('click', '.btn-excluir', function() {
          $(this).closest('tr').fadeOut(300, function() {
            $(this).remove();
          });
        });
      });
    </script>
</body>
</html>
