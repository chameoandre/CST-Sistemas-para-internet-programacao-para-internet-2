<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exemplo 11 - jQuery (LocalStorage + JSON)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <h2>Exemplo 11 — Persistência no LocalStorage (JSON.stringify / parse)</h2>
    
    <form id="form-cadastro" class="card p-3 mb-3">
        <input type="text" id="input-nome" class="form-control mb-2" placeholder="Nome do Cliente" required>
        <input type="email" id="input-email" class="form-control mb-2" placeholder="E-mail" required>
        <button type="submit" id="btn-salvar" class="btn btn-primary">Salvar no LocalStorage</button>
    </form>

    <table class="table table-striped mt-3">
        <thead>
            <tr><th>Nome</th><th>E-mail</th><th>Ação</th></tr>
        </thead>
        <tbody id="tabela-corpo"></tbody>
    </table>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
      $(document).ready(function() {
        let clientes = JSON.parse(localStorage.getItem('lista_clientes')) || [];

        function renderTabela() {
          $('#tabela-corpo').empty();
          clientes.forEach((c, index) => {
            const tr = `
              <tr>
                <td>${c.nome}</td>
                <td>${c.email}</td>
                <td><button class="btn btn-danger btn-sm btn-excluir" data-index="${index}">Remover</button></td>
              </tr>
            `;
            $('#tabela-corpo').append(tr);
          });
        }

        renderTabela();

        $('#form-cadastro').on('submit', function(e) {
          e.preventDefault();
          const nome = $('#input-nome').val();
          const email = $('#input-email').val();

          clientes.push({ nome, email });
          localStorage.setItem('lista_clientes', JSON.stringify(clientes));

          renderTabela();
          $('#form-cadastro')[0].reset();
        });

        $('#tabela-corpo').on('click', '.btn-excluir', function() {
          const index = $(this).data('index');
          clientes.splice(index, 1);
          localStorage.setItem('lista_clientes', JSON.stringify(clientes));
          renderTabela();
        });
      });
    </script>
</body>
</html>
