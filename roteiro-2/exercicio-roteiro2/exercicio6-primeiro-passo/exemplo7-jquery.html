<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exemplo 6 - Primeiros passos jquery</title>
    <!-- 1. Inclusão do jQuery via CDN antes de fechar o corpo -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</head>

<body>
    <!-- 1. Estrutura HTML do Formulário e Alerta Alvo (Bootstrap 5) -->
    <div class="mb-3">
        <label for="input-nome" class="form-label">Digite seu Nome:</label>
        <input type="text" id="input-nome" class="form-control" placeholder="Ex: Maria Silva">
    </div>

    <button type="button" id="btn-saudar" class="btn btn-primary mb-3">
        Enviar Saudação
    </button>

    <div id="caixa-mensagem" class="alert alert-secondary">
        Aguardando interação...
    </div>

    <script>
        $(document).ready(function () {
            //Código jQuery aqui
            // console.log("jQuery carregado e pronto para uso!");
            // 4. Escuta evento de clique e manipula o DOM ($seletor.método)

            $('#btn-saudar').on('click', function () {
                const nomeDigitado = $('#input-nome').val(); // Lê input

                if (nomeDigitado.trim() === '') {
                    $('#caixa-mensagem')
                        .removeClass('alert-secondary alert-success d-none')
                        .addClass('alert-warning')
                        .html(`⚠️ <strong>Atenção!</strong> Por favor, digite um nome antes de clicar!`)
                        .fadeOut(150).fadeIn(150).fadeOut(150).fadeIn(300);
                } else {
                    $('#caixa-mensagem')
                        .removeClass('d-none alert-danger alert-secondary alert-warning')
                        .addClass('alert-success')
                        .html(`🎉 <strong>Sucesso!</strong> Olá <u>${nomeDigitado}</u>, o jQuery animou e leu seu nome com sucesso!`)
                        .fadeOut(150).fadeIn(150).fadeOut(150).fadeIn(400);
                }
            });
        })
    </script>

</body>

</html>
