<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exemplo 9 - jQuery (.slideToggle() e Efeitos Visuais)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <h2>Exemplo 9 — Efeitos de Revelação e Deslizamento (.slideToggle())</h2>
    
    <!-- 📍 DICA DE POSICIONAMENTO: Inseridos APÓS o <h2> e ANTES do <form id="form-cadastro"> -->
    <!-- 1. Botão que aciona a alternância (.slideToggle()) -->
    <button id="btn-toggle-ajuda" class="btn btn-outline-secondary mb-3">ℹ️ Alternar Painel de Instruções</button>
    
    <!-- 2. Painel de ajuda retrátil, oculta por padrão (style="display: none;") -->
    <div id="painel-ajuda" class="alert alert-warning mb-3" style="display: none;">
        <strong>Instruções:</strong> Preencha o nome completo e o e-mail corporativo do cliente antes de salvar.
    </div>

    <!-- Estrutura base do formulário (mantida dos exemplos anteriores) -->

    <form id="form-cadastro" class="card p-3 mb-3">
        <input type="text" id="input-nome" class="form-control mb-2" placeholder="Nome do Cliente">
        <input type="email" id="input-email" class="form-control mb-2" placeholder="E-mail">
        <button type="submit" id="btn-salvar" class="btn btn-primary">Salvar Cliente</button>
    </form>

    <div id="caixa-mensagem" class="alert alert-success" style="display: none;"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
      $(document).ready(function() {
        // Alterna o painel de ajuda deslizando
        $('#btn-toggle-ajuda').on('click', function() {
          $('#painel-ajuda').slideToggle(300);
        });

        $('#form-cadastro').on('submit', function(e) {
          e.preventDefault();
          const nome = $('#input-nome').val();
          const email = $('#input-email').val();

          // Exemplo 9: Desliza o alerta de mensagem suavemente para baixo
          $('#caixa-mensagem')
            .html(`✨ <strong>Cliente Salvo!</strong> <u>${nome}</u> (${email}).`)
            .hide()
            .slideDown(400);
        });
      });
    </script>
</body>
</html>
