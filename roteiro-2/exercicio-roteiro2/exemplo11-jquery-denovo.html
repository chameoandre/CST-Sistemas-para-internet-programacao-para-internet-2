<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 11 - jQuery salvando dados</title>

    <!-- 1. No <head>: Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- 2. No <head>: Bootstrap Icons (Obrigatório para os ícones <i class="bi bi-*">) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- 3. No <head>: chamada do jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</head>

<body>
    <!-- 1. Botão para acionar a alternância -->
    <button id="btn-toggle-ajuda" class="btn btn-outline-secondary mb-3">
        ℹ️ Alternar Instruções
    </button>


    <!-- 2. Painel de ajuda oculto por padrão (display: none) -->
    <div id="painel-ajuda" class="alert alert-warning mb-3" style="display: none;">
        <strong>Instruções:</strong> Preencha o nome e e-mail antes de salvar.
    </div>


    <form id="form-cadastro">
        <input type="text" id="input-nome" class="form-control mb-2" placeholder="Nome">
        <input type="email" id="input-email" class="form-control mb-2" placeholder="E-mail">
        <button type="submit" id="btn-salvar" class="btn btn-primary">Salvar</button>
    </form>

    <div id="caixa-mensagem" class="alert alert-info mt-3 d-none"></div>


    <table class="table table-striped mt-3">
        <thead class="table-dark">
            <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody id="tabela-corpo">
            <!-- Novas linhas <tr> inseridas dinamicamente aqui -->
        </tbody>
    </table>


    <script>
        $(document).ready(function () {
            // 1. Carrega dados salvos ou inicia array vazio []
            let clientes = JSON.parse(localStorage.getItem('lista_clientes')) || [];



            $('#form-cadastro').css('background-color', '#708090');

            $('#btn-toggle-ajuda').on('click', function () {
                $('#painel-ajuda').slideToggle(300);
            });

            // 2. Salvar dados do formulário na tabela e no localStorage
            $('#form-cadastro').on('submit', function (e) {
                e.preventDefault();
                $('#caixa-mensagem').hide().slideDown(400);

                $('#form-cadastro').css('background-color', '#eaf5eb');
                const nome = $('#input-nome').val();
                const email = $('#input-email').val();


                // 2. Adiciona ao array e salva no localStorage
                clientes.push({ nome, email });
                localStorage.setItem('lista_clientes', JSON.stringify(clientes));
                renderTabela();

                // // 3. Inserir nova linha na tabela com .append()
                // const trHtml = `<tr><td>${nome}</td><td>${email}</td><td><button class="btn btn-danger btn-sm btn-excluir">Remover</button></td></tr>`;
                // $('#tabela-corpo').append(trHtml);
                // $('#form-cadastro')[0].reset();


                $('#caixa-mensagem')
                    .removeClass('d-none alert-info alert-danger')
                    .addClass('alert-success')
                    .html(`Lido: <strong>${nome}</strong> (${email})`)
                    .css({ 'background-color': '#d1e7dd', 'color': '#0f5132', 'border-color': '#badbcc' })
                    .fadeOut(300).fadeIn(300)
                    .fadeOut(150).fadeIn(400);
            });


            // 2. Remover a linha <tr> pai ao clicar em Excluir
            $('#tabela-corpo').on('click', '.btn-excluir', function () {
                // $(this).closest('tr').fadeOut(300, function () { $(this).remove(); });
                const index = $(this).data('index');
                clientes.splice(index, 1);
                localStorage.setItem('lista_clientes', JSON.stringify(clientes));
                renderTabela();
            });



            // 3. Renderiza a tabela lendo o array 'clientes'
            function renderTabela() {
                $('#tabela-corpo').empty();
                clientes.forEach((c, index) => {
                    $('#tabela-corpo').append(`
                    <tr>
                        <td>${c.nome}</td><td>${c.email}</td>
                        <td><button class="btn btn-danger btn-sm btn-excluir" data-index="${index}">Remover</button></td>
                    </tr>`);
                });
            }

        });
    </script>
</body>

</html>
