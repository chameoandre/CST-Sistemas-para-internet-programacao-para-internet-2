<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Clientes — Exemplo 11 (jQuery & LocalStorage)</title>
  
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <style>
    body {
      background-color: #0c0a09;
      color: #fafaf9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
    }
    .card-custom {
      background-color: #1c1917;
      border: 1px solid rgba(249, 115, 22, 0.25);
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
    }
    .card-header-custom {
      background: rgba(249, 115, 22, 0.08);
      border-bottom: 1px solid rgba(249, 115, 22, 0.2);
      padding: 1rem 1.25rem;
    }
  </style>
</head>
<body class="py-4">

  <div class="container max-width-900">
    
    <!-- Cabeçalho -->
    <header class="text-center mb-4">
      <span class="badge px-3 py-2 fs-6 mb-2" style="background: rgba(249, 115, 22, 0.2); color: #f97316; border: 1px solid #ea580c;">
        <i class="bi bi-lightning-charge-fill me-1"></i> JQUERY &amp; LOCALSTORAGE (LARANJA &amp; BRANCO)
      </span>
      <h1 class="fw-bold text-white mb-2">
        <i class="bi bi-people-fill text-warning me-2"></i>Cadastro de Clientes (Exemplo 11)
      </h1>
      <p class="text-secondary">
        Aplicação prática de referência: Manipulação Dinâmica do DOM com <strong class="text-warning">jQuery</strong> e Persistência no <strong>LocalStorage</strong>.
      </p>
    </header>

    <div class="row g-4">
      <!-- Formulário de Cadastro -->
      <div class="col-lg-5">
        <div class="card card-custom">
          <div class="card-header-custom">
            <h5 class="mb-0 fw-bold text-white">
              <i class="bi bi-person-plus-fill text-warning me-2"></i>Novo Cliente
            </h5>
          </div>
          <div class="card-body p-4">
            
            <form id="form-cadastro">
              <div class="mb-3">
                <label for="input-nome" class="form-label text-light fw-semibold">Nome Completo:</label>
                <input type="text" class="form-control bg-dark text-light border-secondary" id="input-nome" placeholder="Ex: Maria Silva" required>
              </div>

              <div class="mb-3">
                <label for="input-email" class="form-label text-light fw-semibold">Endereço de E-mail:</label>
                <input type="email" class="form-control bg-dark text-light border-secondary" id="input-email" placeholder="Ex: maria@email.com" required>
              </div>

              <button type="submit" class="btn btn-warning text-dark w-100 fw-bold">
                <i class="bi bi-save-fill me-1"></i> Cadastrar &amp; Salvar no Storage
              </button>
            </form>

            <div id="caixa-mensagem" class="alert alert-success mt-3 d-none mb-0" role="alert"></div>

          </div>
        </div>
      </div>

      <!-- Tabela de Clientes Cadastrados -->
      <div class="col-lg-7">
        <div class="card card-custom">
          <div class="card-header-custom d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold text-white">
              <i class="bi bi-table text-warning me-2"></i>Clientes no LocalStorage
            </h5>
            <button type="button" class="btn btn-outline-danger btn-sm" id="btn-limpar-storage">
              <i class="bi bi-trash3-fill me-1"></i> Limpar Storage
            </button>
          </div>
          <div class="card-body p-0">
            
            <div class="table-responsive">
              <table class="table table-dark table-hover mb-0 align-middle">
                <thead>
                  <tr class="table-active">
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th class="text-center" style="width: 110px;">Ação</th>
                  </tr>
                </thead>
                <tbody id="tabela-corpo">
                  <!-- Linhas geradas dinamicamente via jQuery renderTabela() -->
                </tbody>
              </table>
            </div>

          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- jQuery 3.7.1 CDN -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Lógica da Aplicação -->
  <script src="app.js"></script>
</body>
</html>
